name: SchemaForge Schema Check & PR Diff

on:
  pull_request:
    paths:
      - '**.dbml'
      - '.schemaforge/layout.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  schema-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Checkout PR base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          path: base

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun cache
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('head/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        working-directory: head
        run: bun install --frozen-lockfile

      - name: Run SchemaForge check & comment on PR
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -d "schema" ] && [ -d "../base/schema" ]; then
            bun cli/schemaforge.ts check schema --base ../base/schema --markdown --pr-comment --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          elif [ -f "schema.dbml" ] && [ -f "../base/schema.dbml" ]; then
            bun cli/schemaforge.ts check schema.dbml --base ../base/schema.dbml --markdown --pr-comment --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          elif [ -d "schema" ]; then
            bun cli/schemaforge.ts check schema --markdown --pr-comment --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          elif [ -f "schema.dbml" ]; then
            bun cli/schemaforge.ts check schema.dbml --markdown --pr-comment --repo "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}"
          fi
